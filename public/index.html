<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notely - Premium Notes</title>
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon"><i class="fas fa-feather-alt"></i></span>
          <div class="logo-text">
            <h1>Notely</h1>
            <span>Premium Notes</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="all">
          <i class="fas fa-layer-group"></i>
          <span>All Notes</span>
          <span class="count" id="all-count">0</span>
        </button>
        <button class="nav-item" data-view="pinned">
          <i class="fas fa-thumbtack"></i>
          <span>Pinned</span>
          <span class="count" id="pin-count">0</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="section-header">
          <h3>Categories</h3>
          <button class="icon-btn" id="add-category-btn" title="Add Category">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="category-list" id="category-list">
          <button class="category-item" data-category="all">
            <span class="cat-dot" style="background: linear-gradient(135deg,#6366f1,#8b5cf6)"></span>
            <span>All</span>
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="nav-item" id="toggle-theme">
          <i class="fas fa-moon" id="theme-icon"></i>
          <span>Dark Mode</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="search-input" placeholder="Search notes...">
          <button class="clear-search" id="clear-search"><i class="fas fa-times"></i></button>
        </div>
        <button class="new-note-btn" id="new-note-btn">
          <i class="fas fa-plus"></i>
          <span>New Note</span>
        </button>
      </header>

      <!-- Notes Grid -->
      <section class="notes-container" id="notes-container">
        <div class="notes-header">
          <h2 id="section-title">All Notes</h2>
        </div>
        <div class="notes-grid" id="notes-grid"></div>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon"><i class="fas fa-sticky-note"></i></div>
          <h3>No notes yet</h3>
          <p>Create your first note to get started</p>
          <button class="new-note-btn" onclick="openEditor()">
            <i class="fas fa-plus"></i> Create Note
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Editor Modal -->
  <div class="modal-overlay" id="editor-modal">
    <div class="editor-modal">
      <div class="modal-header">
        <div class="modal-title">
          <input type="text" id="note-title" placeholder="Note title...">
        </div>
        <button class="close-btn" id="close-editor">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="tinymce-toolbar" id="editing-toolbar">
        <button class="tool-btn" data-cmd="bold" title="Bold"><i class="fas fa-bold"></i></button>
        <button class="tool-btn" data-cmd="italic" title="Italic"><i class="fas fa-italic"></i></button>
        <button class="tool-btn" data-cmd="underline" title="Underline"><i class="fas fa-underline"></i></button>
        <span class="tool-separator"></span>
        <button class="tool-btn" data-cmd="insertUnorderedList" title="Bullet List"><i class="fas fa-list-ul"></i></button>
        <button class="tool-btn" data-cmd="insertOrderedList" title="Numbered List"><i class="fas fa-list-ol"></i></button>
        <span class="tool-separator"></span>
        <button class="tool-btn" data-cmd="formatBlock" data-val="h1" title="Heading 1"><i class="fas fa-heading"></i></button>
        <button class="tool-btn" data-cmd="formatBlock" data-val="h2" title="Heading 2"><i class="fas fa-heading"></i></button>
        <span class="tool-separator"></span>
        <button class="tool-btn" data-cmd="justifyLeft" title="Align Left"><i class="fas fa-align-left"></i></button>
        <button class="tool-btn" data-cmd="justifyCenter" title="Align Center"><i class="fas fa-align-center"></i></button>
        <button class="tool-btn" data-cmd="justifyRight" title="Align Right"><i class="fas fa-align-right"></i></button>
        <label class="tool-btn" title="Text Color">
          <i class="fas fa-fill-drip"></i>
          <input type="color" id="text-color" value="#1e293b" style="opacity:0;position:absolute;width:0;height:0">
        </label>
        <label class="tool-btn" title="Highlight Color">
          <i class="fas fa-highlighter"></i>
          <input type="color" id="hl-color" value="#fef08a" style="opacity:0;position:absolute;width:0;height:0">
        </label>
      </div>

      <div class="editable" id="note-content" contenteditable="true" placeholder="Start typing your note..."></div>

      <div class="modal-footer">
        <div class="editor-options">
          <label class="option-label">
            <i class="fas fa-tag"></i>
            <input type="text" id="note-tags" placeholder="Add tags (comma separated)">
          </label>
          <label class="option-label">
            <i class="fas fa-swatchbook"></i>
            <select id="note-category">
              <option value="">No Category</option>
            </select>
          </label>
          <label class="pin-toggle">
            <i class="fas fa-thumbtack"></i>
            <span>Pin</span>
            <input type="checkbox" id="note-pinned" class="toggle-switch">
          </label>
          <label class="option-label">
            <i class="fas fa-palette"></i>
            <input type="color" id="note-color" value="#ffffff" class="color-picker">
          </label>
        </div>
        <div class="editor-actions">
          <button class="danger-btn" id="delete-note-btn"><i class="fas fa-trash"></i> Delete</button>
          <button class="save-btn" id="save-note-btn"><i class="fas fa-save"></i> Save Note</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="category-modal">
      <h3>Add Category</h3>
      <input type="text" id="category-name" placeholder="Category name">
      <div class="color-options" id="color-options"></div>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancel-category">Cancel</button>
        <button class="save-btn" id="save-category">Create</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toast-text">Note saved!</span>
  </div>

  <script src="js/app.js?v=2"></script>
</body>
</html>
